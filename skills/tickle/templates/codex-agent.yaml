version: 1
id: my-codex-job
name: My Codex Job
status: active

triggers:
  - type: script
    schedule: "*/30 * * * *"
    command: ["./checks/has-work.sh"]
    timeout: 30s

run:
  cwd: /path/to/project
  command: ["codex", "exec", "--prompt-file", "./prompt.md"]
  timeout: 2h

env:
  AGENT_MEMORY: ./memory.md
